<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151a26">
<title>The Dynasty Belt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
  :root {
    --bg: #151a26;
    --surface: #1f2536;
    --surface-2: #283047;
    --line: #333c55;
    --text: #ffffff;
    --muted: #8f97ab;
    --teal: #00ceb8;
    --loss: #ff5a7e;
    --gold: #f4c35a;
    --gold-deep: #b9861f;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }

  /* Top bar, like Sleeper's league header */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0 14px;
    border-bottom: 1px solid var(--line);
  }
  .league-av { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); object-fit: cover; flex: none; }
  .topbar h1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; }
  .refresh {
    margin-left: auto; flex: none;
    background: var(--surface-2); color: var(--text);
    border: 0; border-radius: 999px; padding: 8px 14px;
    font: 600 13px/1 "Poppins", system-ui, sans-serif; cursor: pointer;
  }
  .refresh:hover { background: var(--line); }
  .refresh:focus-visible, a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  section { margin-top: 22px; }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .card { background: var(--surface); border-radius: var(--radius); }

  /* The belt */
  .champ { padding: 26px 16px 22px; text-align: center; overflow: hidden; position: relative; }
  .champ::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 55% at 50% 38%, rgba(244,195,90,.16), transparent 70%);
    pointer-events: none;
  }
  .belt { position: relative; height: 150px; display: flex; align-items: center; justify-content: center; margin: 0 -16px; }
  .strap {
    position: absolute; left: 0; right: 0; top: 50%; height: 58px; transform: translateY(-50%);
    background: linear-gradient(#0d1019, #1a1f2c 45%, #0d1019);
    border-top: 2px solid #2e3548; border-bottom: 2px solid #2e3548;
  }
  .strap::before, .strap::after {
    content: ""; position: absolute; left: 0; right: 0; height: 0;
    border-top: 1.5px dashed rgba(244,195,90,.45);
  }
  .strap::before { top: 7px; } .strap::after { bottom: 7px; }
  .side-plate {
    position: absolute; top: 50%; width: 46px; height: 66px; transform: translateY(-50%);
    background: linear-gradient(135deg, #ffe7a3, var(--gold) 45%, var(--gold-deep));
    clip-path: polygon(20% 0, 80% 0, 100% 50%, 80% 100%, 20% 100%, 0 50%);
  }
  .side-plate.l { left: calc(50% - 150px); } .side-plate.r { right: calc(50% - 150px); }
  .plate {
    position: relative; width: 176px; height: 150px;
    background: linear-gradient(145deg, #fff0c2 0%, var(--gold) 38%, #d9a13a 70%, var(--gold-deep) 100%);
    clip-path: polygon(22% 0, 78% 0, 100% 24%, 100% 76%, 78% 100%, 22% 100%, 0 76%, 0 24%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .plate-inner {
    position: absolute; inset: 7px;
    clip-path: polygon(22% 0, 78% 0, 100% 24%, 100% 76%, 78% 100%, 22% 100%, 0 76%, 0 24%);
    background: linear-gradient(160deg, #3a2a0c, #1c1407);
  }
  .plate > *:not(.plate-inner) { position: relative; }
  .plate .av { width: 76px; height: 76px; border: 3px solid var(--gold); box-shadow: 0 0 0 2px #1c1407; }
  .engrave { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--gold); }

  .champ-name { margin: 18px 0 0; font-size: 26px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
  .champ-team { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .reign { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .chip { background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .chip b { color: var(--gold); font-weight: 700; }

  /* Avatars */
  .av {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: var(--surface-2); object-fit: cover;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: var(--muted); overflow: hidden;
  }

  /* Next matchup, modelled on Sleeper's matchup header */
  .match { padding: 16px; }
  .match-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .pill { border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
  .pill.live { background: rgba(0,206,184,.15); color: var(--teal); }
  .pill.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); margin-right: 6px; vertical-align: 1px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .sides { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .side { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
  .side .av { width: 56px; height: 56px; font-size: 18px; }
  .side.holder .av { box-shadow: 0 0 0 2px var(--gold); }
  .side .nm { font-weight: 700; font-size: 14px; margin-top: 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .tm { color: var(--muted); font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .rec { color: var(--muted); font-size: 12px; }
  .side .pts { font-size: 24px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .side .pts.ahead { color: var(--teal); }
  .side .role { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .side.holder .role { color: var(--gold); }
  .vs { color: var(--muted); font-weight: 700; font-size: 13px; }
  .match-note { margin: 14px 0 0; color: var(--muted); font-size: 13px; text-align: center; }

  /* Leaderboard */
  .rows { padding: 4px 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .who { min-width: 0; flex: 1; }
  .who .nm { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .tm { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--teal); border-radius: 3px; }
  .row.is-holder .bar i { background: var(--gold); }
  .count { font-size: 20px; font-weight: 800; min-width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  .count small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: -3px; }
  .row.zero { opacity: .5; }
  .crown { font-size: 13px; margin-left: 4px; }

  /* History */
  .fight { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; }
  .fight + .fight { border-top: 1px solid var(--line); }
  .wk { color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.2; }
  .wk b { display: block; color: var(--text); font-size: 16px; }
  .fight .line { font-size: 13.5px; min-width: 0; }
  .fight .line .w { font-weight: 700; }
  .fight .line .l { color: var(--muted); }
  .fight .score { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
  .tag.retained { background: rgba(0,206,184,.14); color: var(--teal); }
  .tag.new { background: rgba(244,195,90,.16); color: var(--gold); }
  .tag.crowned { background: rgba(244,195,90,.16); color: var(--gold); }
  .tag.idle { background: var(--surface-2); color: var(--muted); }

  .state { padding: 60px 16px; text-align: center; color: var(--muted); }
  .state strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--teal); margin: 0 auto 14px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 28px; }

  @media (prefers-reduced-motion: reduce) {
    .spinner, .pill.live::before { animation: none; }
  }
  @media (max-width: 380px) {
    .side-plate { display: none; }
    .champ-name { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <img class="league-av" id="leagueAv" alt="">
    <div>
      <h1 id="leagueName">The Dynasty League</h1>
      <div class="sub" id="updated">Loading from Sleeper…</div>
    </div>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </header>
  <main id="app"><div class="state"><div class="spinner"></div>Loading the belt…</div></main>
  <footer>Live data from Sleeper. The belt changes hands only in head-to-head games; the league-median result doesn't count.</footer>
</div>

<script>
/* ------------------------------------------------------------------
   Settings. The belt's first fight was Kieran vs Josh in Week 2 of
   the 2026 season, so history starts there. Next season's league is
   found automatically from this one.
------------------------------------------------------------------- */
const CONFIG = {
  leagueId: "1389359192053157888",
  startWeek: 2,
  startHolder: "KieranLee94",   // Sleeper username of the first belt holder
  liveRefreshSeconds: 120       // how often to refresh while a belt game is live
};

const API = "https://api.sleeper.app/v1";
const MAX_WEEK = 18;

async function get(path) {
  const r = await fetch(API + path, { cache: "no-store" });
  if (!r.ok) throw new Error(`Sleeper returned ${r.status} for ${path}`);
  return r.json();
}

function avatarUrl(u) {
  if (!u) return null;
  const m = u.metadata && u.metadata.avatar;
  if (m && /^https?:\/\//.test(m)) return m;
  if (u.avatar) return `https://sleepercdn.com/avatars/thumbs/${u.avatar}`;
  return null;
}

const pts = (m) => Number(m && (m.custom_points ?? m.points) || 0);

/* ---------------- Data loading ---------------- */

async function loadSeason(league, firstWeek) {
  const id = league.league_id;
  const [users, rosters] = await Promise.all([get(`/league/${id}/users`), get(`/league/${id}/rosters`)]);
  const lastScored = Number((league.settings && league.settings.last_scored_leg) || 0);
  const lastWeek = Math.min(MAX_WEEK, lastScored + 1);
  const weeks = [];
  for (let w = firstWeek; w <= lastWeek; w++) weeks.push(w);
  const lists = await Promise.all(weeks.map(w => get(`/league/${id}/matchups/${w}`).catch(() => [])));
  const matchups = {};
  weeks.forEach((w, i) => { matchups[w] = lists[i] || []; });
  return { league, users: users || [], rosters: rosters || [], lastScored, matchups, firstWeek };
}

// Dynasty leagues get a new league ID each season; find it through a manager's league list.
async function findNextSeasonLeague(season) {
  const nextYear = Number(season.league.season) + 1;
  for (const u of season.users.slice(0, 5)) {
    try {
      const leagues = await get(`/user/${u.user_id}/leagues/nfl/${nextYear}`);
      const hit = (leagues || []).find(l => l.previous_league_id === season.league.league_id);
      if (hit) return hit;
    } catch (e) { /* try the next manager */ }
  }
  return null;
}

async function loadAll() {
  const [state, first] = await Promise.all([get("/state/nfl"), get(`/league/${CONFIG.leagueId}`)]);
  const seasons = [await loadSeason(first, CONFIG.startWeek)];
  const currentYear = Number(state.league_season || state.season);
  let cur = seasons[0];
  while (Number(cur.league.season) < currentYear) {
    const next = await findNextSeasonLeague(cur);
    if (!next) break;
    cur = await loadSeason(await get(`/league/${next.league_id}`), 1);
    seasons.push(cur);
  }
  return { state, seasons };
}

/* ---------------- Belt logic ---------------- */

function rosterOf(season, userId) {
  return season.rosters.find(r => r.owner_id === userId || (r.co_owners || []).includes(userId));
}
function ownerOf(season, rosterId) {
  const r = season.rosters.find(r => r.roster_id === rosterId);
  return r ? r.owner_id : null;
}
function findFight(season, week, userId) {
  const roster = rosterOf(season, userId);
  if (!roster) return null;
  const list = season.matchups[week] || [];
  const mine = list.find(m => m.roster_id === roster.roster_id);
  if (!mine || mine.matchup_id == null) return null;
  const opp = list.find(m => m.matchup_id === mine.matchup_id && m.roster_id !== mine.roster_id);
  if (!opp) return null;
  return { mine, opp, challenger: ownerOf(season, opp.roster_id) };
}

function computeBelt({ seasons }) {
  const people = new Map();
  for (const s of seasons) for (const u of s.users) {
    people.set(u.user_id, {
      id: u.user_id,
      name: u.display_name || "Unknown manager",
      team: (u.metadata && u.metadata.team_name) || `Team ${u.display_name || "Unknown"}`,   // Sleeper's default when no team name is set
      avatar: avatarUrl(u)
    });
  }

  const seed = seasons[0].users.find(u => (u.display_name || "").toLowerCase() === CONFIG.startHolder.toLowerCase());
  if (!seed) throw new Error(`Couldn't find "${CONFIG.startHolder}" in the league. Update startHolder at the top of the file.`);

  let holder = seed.user_id;
  let decided = false;
  let reign = { season: null, week: null, weeks: 0 };
  const weeksHeld = new Map();
  const history = [];

  for (const s of seasons) {
    const last = Math.min(s.lastScored, MAX_WEEK);
    for (let w = s.firstWeek; w <= last; w++) {
      const at = { season: s.league.season, week: w };
      const f = findFight(s, w, holder);
      if (!f) { if (decided) history.push({ ...at, type: "idle", holder }); continue; }
      const hp = pts(f.mine), cp = pts(f.opp);
      const before = holder;
      let type;
      if (cp > hp) {                       // ties go to the holder
        holder = f.challenger;
        type = decided ? "new" : "crowned";
        reign = { ...at, weeks: 0 };
      } else {
        type = decided ? "retained" : "crowned";
        if (!decided) reign = { ...at, weeks: 0 };
      }
      decided = true;
      reign.weeks++;
      weeksHeld.set(holder, (weeksHeld.get(holder) || 0) + 1);
      history.push({ ...at, type, holder: before, challenger: f.challenger, hp, cp, winner: holder });
    }
  }

  // The holder's next (or live) fight
  const latest = seasons[seasons.length - 1];
  const nextWeek = latest.lastScored + 1;
  let next;
  if (latest.league.status === "complete" || nextWeek > MAX_WEEK) {
    next = { type: "offseason" };
  } else {
    const f = findFight(latest, nextWeek, holder);
    if (f) {
      const hp = pts(f.mine), cp = pts(f.opp);
      next = { type: hp + cp > 0 ? "live" : "upcoming", week: nextWeek, season: latest.league.season, challenger: f.challenger, hp, cp };
    } else {
      next = { type: "none", week: nextWeek };
    }
  }

  const records = new Map();
  for (const r of latest.rosters) {
    const st = r.settings || {};
    records.set(r.owner_id, `${st.wins || 0}-${st.losses || 0}${st.ties ? "-" + st.ties : ""}`);
  }

  // Everyone in the current league appears on the leaderboard, including 0s
  const board = latest.rosters.map(r => r.owner_id).filter(Boolean);
  for (const id of weeksHeld.keys()) if (!board.includes(id)) board.push(id);
  board.sort((a, b) => (weeksHeld.get(b) || 0) - (weeksHeld.get(a) || 0) ||
    (people.get(a)?.name || "").localeCompare(people.get(b)?.name || ""));

  return { people, holder, decided, reign, weeksHeld, history, next, records, board, multiSeason: seasons.length > 1 };
}

/* ---------------- Rendering ---------------- */

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => n.toFixed(2);

function av(p, cls = "") {
  const initial = esc((p?.name || "?").charAt(0).toUpperCase());
  if (p?.avatar) return `<img class="av ${cls}" src="${esc(p.avatar)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'av ${cls}',textContent:'${initial}'}))">`;
  return `<span class="av ${cls}">${initial}</span>`;
}

function weekLabel(at, multi) {
  return multi ? `Week ${at.week}, ${at.season}` : `Week ${at.week}`;
}

function render(data, belt) {
  const { people, holder, reign, weeksHeld, history, next, records, board, multiSeason } = belt;
  const league = data.seasons[data.seasons.length - 1].league;
  document.getElementById("leagueName").textContent = league.name || "The Dynasty League";
  const lav = document.getElementById("leagueAv");
  if (league.avatar) lav.src = `https://sleepercdn.com/avatars/thumbs/${league.avatar}`;
  document.getElementById("updated").textContent =
    `Dynasty Belt, updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;

  const h = people.get(holder) || { name: "Unknown" };
  const s = (n) => (n === 1 ? "" : "s");

  // Champion
  let html = `
  <section class="card champ" aria-label="Current belt holder">
    <div class="belt" aria-hidden="true">
      <div class="strap"></div>
      <div class="side-plate l"></div><div class="side-plate r"></div>
      <div class="plate"><div class="plate-inner"></div>${av(h)}<span class="engrave">DYNASTY BELT</span></div>
    </div>
    <p class="champ-name">${esc(h.name)}</p>
    ${h.team ? `<div class="champ-team">${esc(h.team)}</div>` : ""}
    <div class="reign">
      ${belt.decided
        ? `<span class="chip">Current reign <b>${reign.weeks} week${s(reign.weeks)}</b></span>
           <span class="chip">Holder since ${esc(weekLabel(reign, multiSeason))}</span>`
        : `<span class="chip">First belt fight in Week ${CONFIG.startWeek}</span>`}
    </div>
  </section>`;

  // Next fight
  html += `<section><h2>${next.type === "live" ? "Belt on the line now" : "Next title defence"}</h2><div class="card match">`;
  if (next.type === "live" || next.type === "upcoming") {
    const c = people.get(next.challenger) || { name: "Unknown" };
    const live = next.type === "live";
    const hAhead = live && next.hp >= next.cp, cAhead = live && next.cp > next.hp;
    html += `
      <div class="match-head"><span>Week ${next.week}</span><span class="pill ${live ? "live" : ""}">${live ? "Live" : "Upcoming"}</span></div>
      <div class="sides">
        <div class="side holder"><div class="role">Belt holder</div>${av(h)}<div class="nm">${esc(h.name)}</div><div class="tm">${esc(h.team)}</div><div class="rec">${esc(records.get(holder) || "")}</div>${live ? `<div class="pts ${hAhead ? "ahead" : ""}">${fmt(next.hp)}</div>` : ""}</div>
        <div class="vs">VS</div>
        <div class="side"><div class="role">Challenger</div>${av(c)}<div class="nm">${esc(c.name)}</div><div class="tm">${esc(c.team)}</div><div class="rec">${esc(records.get(next.challenger) || "")}</div>${live ? `<div class="pts ${cAhead ? "ahead" : ""}">${fmt(next.cp)}</div>` : ""}</div>
      </div>
      <p class="match-note">${live
        ? (cAhead ? `${esc(c.name)} is ahead. If it stays that way, the belt changes hands.` : `${esc(h.name)} is ahead and on course to keep the belt.`)
        : `${esc(c.name)} gets a shot at the belt in Week ${next.week}.`}</p>`;
  } else if (next.type === "offseason") {
    html += `<p class="match-note" style="margin:0">The season's over. ${esc(h.name)} carries the belt into next season.</p>`;
  } else {
    html += `<p class="match-note" style="margin:0">${esc(h.name)} has no head-to-head game in Week ${next.week}, so the belt isn't on the line.</p>`;
  }
  html += `</div></section>`;

  // Leaderboard
  const max = Math.max(1, ...board.map(id => weeksHeld.get(id) || 0));
  html += `<section><h2>Weeks held</h2><div class="card rows">`;
  for (const id of board) {
    const p = people.get(id) || { name: "Unknown manager" };
    const n = weeksHeld.get(id) || 0;
    const isH = id === holder;
    html += `
      <div class="row ${isH ? "is-holder" : ""} ${n === 0 ? "zero" : ""}">
        ${av(p)}
        <div class="who">
          <div class="nm">${esc(p.name)}${isH ? `<span class="crown" title="Current holder">🏆</span>` : ""}</div>
          ${p.team ? `<div class="tm">${esc(p.team)}</div>` : ""}
          <div class="bar"><i style="width:${(n / max) * 100}%"></i></div>
        </div>
        <div class="count">${n}<small>week${s(n)}</small></div>
      </div>`;
  }
  html += `</div></section>`;

  // History
  html += `<section><h2>Belt history</h2><div class="card rows">`;
  if (!history.length) html += `<div class="fight"><span></span><span class="line l">No belt fights have finished yet.</span><span></span></div>`;
  for (const f of [...history].reverse()) {
    const wk = `<div class="wk">${multiSeason ? esc(f.season) : "Wk"}<b>${f.week}</b></div>`;
    if (f.type === "idle") {
      const p = people.get(f.holder) || { name: "Unknown" };
      html += `<div class="fight">${wk}<div class="line"><span class="w">${esc(p.name)}</span> <span class="l">had no head-to-head game</span></div><span class="tag idle">Not at stake</span></div>`;
      continue;
    }
    const winner = people.get(f.winner) || { name: "Unknown" };
    const loserId = f.winner === f.holder ? f.challenger : f.holder;
    const loser = people.get(loserId) || { name: "Unknown" };
    const wp = f.winner === f.holder ? f.hp : f.cp, lp = f.winner === f.holder ? f.cp : f.hp;
    const tag = { retained: "Defended", new: "New holder", crowned: "First holder" }[f.type];
    html += `
      <div class="fight">${wk}
        <div class="line"><span class="w">${esc(winner.name)}</span> <span class="l">beat ${esc(loser.name)}</span>
          <div class="score">${fmt(wp)} to ${fmt(lp)}</div></div>
        <span class="tag ${f.type}">${tag}</span>
      </div>`;
  }
  html += `</div></section>`;

  document.getElementById("app").innerHTML = html;
}

function renderError(err) {
  document.getElementById("updated").textContent = "Couldn't load from Sleeper";
  document.getElementById("app").innerHTML =
    `<div class="state"><strong>Sleeper didn't respond</strong>${esc(err.message)}<br>Check your connection, then tap Refresh.</div>`;
}

let timer = null;
async function run() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    const data = await loadAll();
    const belt = computeBelt(data);
    render(data, belt);
    clearTimeout(timer);
    if (belt.next.type === "live") timer = setTimeout(run, CONFIG.liveRefreshSeconds * 1000);
  } catch (err) {
    console.error(err);
    renderError(err);
  } finally {
    btn.disabled = false; btn.textContent = "Refresh";
  }
}

if (typeof document !== "undefined") {
  document.getElementById("refresh").addEventListener("click", run);
  run();
} else if (typeof module !== "undefined") {
  module.exports = { computeBelt, CONFIG };
}
</script>
</body>
</html>
